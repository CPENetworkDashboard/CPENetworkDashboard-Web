name = "cpe-status-trigger"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false

[vars]
GITHUB_REPOSITORY = "CPENetworkDashboard/CPENetworkDashboard-Web"

# UTC minutes 2, 7, ... 57, matching the collector's five-minute slots.
[triggers]
crons = ["2,7,12,17,22,27,32,37,42,47,52,57 * * * *"]

[observability]
enabled = true
