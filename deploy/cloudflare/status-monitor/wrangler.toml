name = "cpe-status-monitor"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false

[vars]
CPE_STATUS_ORIGIN = "https://cpe.yuan6.cn"

# Replace with the id from `wrangler kv namespace create STATUS_QUEUE`.
[[kv_namespaces]]
binding = "STATUS_QUEUE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# UTC minutes 2, 7, ... 57, matching the collector's five-minute slots.
[triggers]
crons = ["2,7,12,17,22,27,32,37,42,47,52,57 * * * *"]

[observability]
enabled = true
