name: Service availability monitoring

on:
  push:
    branches: [main]
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpe-service-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPE_STATUS_ORIGIN: ${{ vars.CPE_STATUS_ORIGIN || 'https://cpe.yuan6.cn' }}
      CPE_STATUS_TOKEN: ${{ secrets.CPE_STATUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore unsent measurements
        uses: actions/cache/restore@v4
        with:
          path: .status-reports
          key: cpe-status-pending-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cpe-status-pending-
      - name: Check services and persist results
        run: node scripts/collect-status.mjs
      - name: Keep measurements for replay after outages
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .status-reports
          key: cpe-status-pending-${{ github.run_id }}-${{ github.run_attempt }}
